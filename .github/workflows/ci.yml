# Hidden Harbours — Continuous Integration
# Runs the Unity EditMode + PlayMode tests on every push/PR so `main` stays green
# (CLAUDE.md rule 10, agents/coordination.md §4-§5). Owned by qa-test.
#
# TRIAGING A RED X — start from the verdict, not the per-step conclusions. The job's final
# step ("Red X verdict — environment fault or code failure?") runs only when the job fails
# and posts a one-line diagnosis as an ::error:: annotation (the box at the top of the run
# page and the PR checks tab) plus a step-summary heading. It says ENVIRONMENT FAULT
# (hub install, license activation, or checkout died before any test ran — not your code;
# re-run the job), ACCOUNT BILLING (the Git LFS budget is exhausted — re-runs cannot pass;
# the owner must raise the budget in GitHub billing settings), or TESTS RAN AND FAILED
# (read the "Summarise test failures" output for the failing tests). On green runs the
# verdict step shows as skipped.
#
# WHY BUILDALON (and not GameCI): Unity 6 issues a machine-bound "entitlement" license,
# and Unity removed manual `.ulf` activation for free Personal licenses back in ~2023.
# GameCI's Docker test-runner is hard-wired to need a `.ulf` that a Personal seat can no
# longer produce, so it cannot work for this project. The Buildalon actions activate a
# Personal license at runtime against Unity's licensing servers using just an email +
# password — no `.ulf` file and no serial number.
#
# ONE-TIME SETUP (required before this can pass) — add two repository secrets under
# Settings ▸ Secrets and variables ▸ Actions ▸ "New repository secret":
#     UNITY_EMAIL     = the email address for your Unity ID
#     UNITY_PASSWORD  = the password for your Unity ID
# No serial and no `.ulf` are needed for a Personal license. NOTE: the Unity account must
# NOT have two-factor (2FA) on password login, or the automated activation will fail.
# Until these secrets exist, the "Activate Unity license" step fails — that is expected.
#
# The third-party Buildalon actions are pinned to commit SHAs (supply-chain hygiene) because
# they receive the Unity credentials. To bump one, update the SHA *and* its trailing
# `# vX` comment together.
#
# WHY THE HUB IS PINNED (`hub-version: 3.19.5`) — do not remove without re-testing.
# Unity Hub 3.20.0 (in the apt repo from 2026-07-29 ~22:00Z) stopped installing the
# executable at `/opt/unityhub/unityhub`. Every run repo-wide then died at "Set up Unity" with
#     Error: ENOENT: no such file or directory, access '/opt/unityhub/unityhub'
# including re-runs of commits that had been green — so it was the action's environment, not our
# code. That path is hard-coded in THREE places across the toolchain, which is why nothing
# smaller fixes it: `unity-setup` asserts it exists; the `/usr/bin/unity-hub` xvfb wrapper the
# action writes execs it by absolute path (so `UNITY_HUB_PATH` alone cannot help); and
# `activate-unity-license` reaches for `/opt/unityhub/UnityLicensingClient_V1/…`.
# 3.19.5 is the last version whose postinst does `update-alternatives: using
# /opt/unityhub/unityhub` — it is the exact version the last green run (2026-07-29 19:32Z)
# installed, so this pin restores a proven-good environment rather than guessing at one.
# `hub-version` is a first-class input of the pinned action and auto-disables `auto-update-hub`,
# so the SHA pin above is untouched. When upstream teaches the toolchain the 3.20+ layout, drop
# this line and let the hub float again.

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to the same branch cancels the previous (still-running) CI — Unity installs are
# expensive, so don't burn runner minutes on a run that's already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: EditMode + PlayMode tests
    runs-on: ubuntu-latest
    steps:
      # WHY LFS IS CACHED (not `lfs: true` on checkout): checkout with `lfs: true` downloads
      # the full ~227 MB LFS object set from GitHub's LFS store on EVERY run. At ~164 runs in
      # the first six days of Aug 2026 that was ~36 GB of LFS bandwidth — which exhausted the
      # account's Git LFS budget on 2026-08-06. Instead: plain checkout (pointer files only),
      # restore `.git/lfs` from the actions cache keyed on the LFS manifest, then `git lfs
      # pull` fetches only the objects the cache lacks. An unchanged LFS set costs ~zero LFS
      # bandwidth per run. (The actions cache only saves on a green job, so the first green
      # run after a change pays the download once and later runs ride the cache.)
      - name: Checkout (LFS pointers only)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compute LFS manifest (cache key)
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: |
            lfs-

      - name: Pull LFS objects
        id: lfs_pull
        shell: bash
        run: |
          # The pull log is tee'd so the Red X verdict step can tell an exhausted LFS budget
          # (account billing — a re-run cannot fix it) apart from a transient checkout death.
          set -o pipefail
          if ! git lfs pull 2>&1 | tee "$RUNNER_TEMP/git-lfs-pull.log"; then
            if grep -qi "exceeded its LFS budget" "$RUNNER_TEMP/git-lfs-pull.log"; then
              echo "budget=exceeded" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          git lfs checkout

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Set up Unity
        id: setup_unity
        uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b # v2
        with:
          version-file: 'ProjectSettings/ProjectVersion.txt'   # resolves to 6000.5.0f1
          build-targets: StandaloneLinux64
          cache-installation: true                             # cache the multi-GB editor between runs
          hub-version: '3.19.5'                                # see "WHY THE HUB IS PINNED" above

      - name: Activate Unity license (Personal)
        id: activate_license
        uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af # v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: EditMode tests
        id: editmode
        uses: buildalon/unity-action@2d420bea0f47fbe01377601fa3231bcf4de04f3a # v3
        with:
          log-name: editmode-tests
          args: -batchmode -runTests -testPlatform EditMode -testResults ${{ github.workspace }}/artifacts/editmode-results.xml

      - name: PlayMode tests
        id: playmode
        # Run even if EditMode failed, so a single CI run reports both suites.
        if: success() || failure()
        uses: buildalon/unity-action@2d420bea0f47fbe01377601fa3231bcf4de04f3a # v3
        with:
          log-name: playmode-tests
          args: -batchmode -runTests -testPlatform PlayMode -testResults ${{ github.workspace }}/artifacts/playmode-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts

      # WHY THIS EXISTS: without it, a red CI run is effectively undiagnosable from outside GitHub's web
      # UI. Unity's batchmode runner prints each failure inline in the middle of a ~1 MB log and never
      # summarises at the end, the check-run's output.text comes back empty, and the results XML is only
      # reachable as an artifact behind an authenticated download. So an agent (or anyone on a phone) can
      # see "EditMode failed" and not which test. Parsing the XML into the LAST thing the log prints puts
      # the failure list where the log tail always reaches it, for every future run.
      #
      # Runs on always() and never changes the job's outcome — it is a reporter, not a gate. The suite
      # steps above have already decided pass/fail.
      - name: Summarise test failures
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/*-results.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No results XML found — the suites did not get as far as writing one."
            exit 0
          fi
          python3 - "${files[@]}" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys, xml.etree.ElementTree as ET

          MAX_FAILURES = 40       # a wall of failures is a compile break; the first 40 tell that story
          MAX_MESSAGE_CHARS = 800 # NUnit messages carry the expected/actual block, which is the useful part

          any_failed = False
          for path in sys.argv[1:]:
              try:
                  root = ET.parse(path).getroot()
              except Exception as e:                      # a truncated XML means Unity died mid-run
                  print(f"### {path}: could not be parsed ({e}) — the editor probably crashed")
                  any_failed = True
                  continue

              total  = root.get("total")    or root.get("testcasecount") or "?"
              passed = root.get("passed")   or "?"
              failed = root.get("failed")   or "0"
              skipped= root.get("skipped")  or "0"
              print(f"\n### {path} — {passed}/{total} passed, {failed} failed, {skipped} skipped")

              cases = [c for c in root.iter("test-case") if c.get("result") == "Failed"]
              if not cases:
                  continue
              any_failed = True
              for case in cases[:MAX_FAILURES]:
                  print(f"\nFAILED: {case.get('fullname') or case.get('name')}")
                  failure = case.find("failure")
                  if failure is None:
                      continue
                  for tag in ("message", "stack-trace"):
                      node = failure.find(tag)
                      text = (node.text or "").strip() if node is not None else ""
                      if not text:
                          continue
                      if tag == "stack-trace":
                          text = "\n".join(text.splitlines()[:4])   # the assert site, not the whole frame
                      elif len(text) > MAX_MESSAGE_CHARS:
                          text = text[:MAX_MESSAGE_CHARS] + " …[truncated]"
                      print(f"  {tag}: {text}")
              if len(cases) > MAX_FAILURES:
                  print(f"\n…and {len(cases) - MAX_FAILURES} more failures (showing the first {MAX_FAILURES}).")

          if not any_failed:
              print("\nNo failing test cases in any results file.")
          PY

      # WHY THIS EXISTS: this job has two documented pre-test fault modes — "Set up Unity"
      # (the hub-pin story above) and "Activate Unity license" (licensing servers / secrets) —
      # and both used to produce exactly the same red X as a genuine compile/test failure; in
      # one day three separate sessions each burned time reading per-step conclusions to tell
      # them apart. This step makes the red X carry the diagnosis: on a failed run it inspects
      # which step died (via the step ids above) and writes a one-line verdict as an ::error::
      # annotation — surfaced at the top of the run page and on the PR checks tab — plus a
      # step-summary heading. It runs only on failure (skipped on green), always exits 0, and
      # never changes the job's outcome — a reporter, not a gate. Gate semantics are untouched:
      # an environment fault stays red, and re-running stays a manual human act (an auto-retry
      # could mask a real break and burns expensive Unity-install minutes).
      - name: Red X verdict — environment fault or code failure?
        if: failure()
        shell: bash
        env:
          LFS_BUDGET: ${{ steps.lfs_pull.outputs.budget }}
          SETUP: ${{ steps.setup_unity.outcome }}
          ACTIVATE: ${{ steps.activate_license.outcome }}
          EDITMODE: ${{ steps.editmode.outcome }}
          PLAYMODE: ${{ steps.playmode.outcome }}
        run: |
          # verdict <headline> <detail> — the headline is the annotation title and the summary
          # heading. Keep headlines free of ':' and ',': annotation TITLE properties need those
          # escaped (%3A / %2C); the message part after '::' does not.
          verdict() {
            echo "::error title=${1}::${2}"
            { echo "## ${1}"; echo; echo "${2}"; } >> "$GITHUB_STEP_SUMMARY"
          }
          # Order matters: PlayMode's `success() || failure()` means it runs (and fails) even
          # when setup died, so check the environment steps before reading the test outcomes —
          # and the LFS-budget case before everything, because it is the one fault a re-run
          # can never fix.
          if [ "$LFS_BUDGET" = "exceeded" ]; then
            verdict "ACCOUNT BILLING — Git LFS budget exhausted — re-runs CANNOT pass" \
              "GitHub refused the LFS download because the account has exceeded its Git LFS bandwidth budget. This is billing, not code and not a flake — do NOT re-run the job; every re-run fails the same way and burns more of any remaining quota. The owner must raise the Git LFS budget in GitHub's billing settings (Settings ▸ Billing and plans ▸ Git LFS). Ignore the PlayMode failure below: the 'success() || failure()' guard makes that step run with no Unity installed, so its red is this same fault echoing, not a test result."
          elif [ "$SETUP" = "failure" ]; then
            verdict "ENVIRONMENT FAULT at 'Set up Unity' — not a code failure" \
              "The Unity Hub / editor-install toolchain died before any test ran. Re-run the job; if it recurs, read the hub-pin header in .github/workflows/ci.yml."
          elif [ "$ACTIVATE" = "failure" ]; then
            verdict "ENVIRONMENT FAULT at 'Activate Unity license' — not a code failure" \
              "Unity's licensing servers / the repo credentials failed before any test ran. Re-run the job; see the secrets notes in the header of .github/workflows/ci.yml."
          elif [ "$SETUP" = "skipped" ] || [ "$ACTIVATE" = "skipped" ]; then
            verdict "ENVIRONMENT FAULT before Unity setup — not a code failure" \
              "Checkout / LFS / cache died, so Unity setup never ran and no test ran. Re-run the job; the red step in the step list says which one."
          elif [ "$EDITMODE" = "failure" ] || [ "$PLAYMODE" = "failure" ]; then
            verdict "TESTS RAN AND FAILED — read the failure summary" \
              "The environment came up (setup and licensing green) and a test step failed (EditMode: ${EDITMODE}, PlayMode: ${PLAYMODE}). The 'Summarise test failures' step lists the failing tests — if it reports no results XML, the editor crashed mid-run rather than tests asserting."
          else
            verdict "FAILED OUTSIDE SETUP AND TESTS — read the step list" \
              "Neither the environment steps nor the test steps failed (setup: ${SETUP}, activate: ${ACTIVATE}, EditMode: ${EDITMODE}, PlayMode: ${PLAYMODE}). A later reporting step (upload / summarise) or something unusual did."
          fi
