<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>St Peters set pieces — harness</title>
<style>
  body { margin: 0; background: #0b1418; color: #aab6b4; font: 12px ui-monospace, Menlo, monospace; padding: 18px; }
  h1 { font-size: 16px; color: #eef3ee; font-weight: normal; margin: 0 0 10px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  select, input { background: #101d1e; color: #cfd6cc; border: 1px solid #26413c; font: inherit; padding: 4px 6px; }
  .piece { margin: 0 0 18px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; gap: 3px; align-items: center; }
  canvas { image-rendering: pixelated; background: #50604f; }
  .note { color: #6b807c; font-size: 11px; margin: 2px 0 6px; }
</style>
</head>
<body>
<h1>St Peters set pieces · every piece at all 8 facings, lit by one sky</h1>
<div class="bar">
  <label>time <input id="t" type="range" min="4.5" max="23.5" step="0.25" value="14"></label><span id="tl">14:00</span>
  <label>cloud <input id="c" type="range" min="0" max="1" step="0.05" value="0.1"></label>
  <label>state <select id="d"><option value="derelict">derelict / today</option><option value="restored">restored (M3)</option></select></label>
  <label>zoom <select id="z"><option>1</option><option selected>2</option><option>3</option></select></label>
  <label><input id="o" type="checkbox"> keyline A/B</label>
  <label>vane wind from <input id="w" type="range" min="0" max="337.5" step="22.5" value="270"></label><span id="wl">270</span>
</div>
<div id="out"></div>
<script src="lib/weatherSky.js"></script>
<script src="lib/coastalPass.js"></script>
<script src="stPetersSetPieces.js"></script>
<script>
  const SP = StPetersSetPieces, $ = (id) => document.getElementById(id);
  function draw() {
    const t = +$('t').value, sky = WeatherSky.at({ time: t, cloud: +$('c').value, wind: 0.3 }), Z = +$('z').value, dec = $('d').value;
    $('tl').textContent = String(Math.floor(t)).padStart(2, '0') + ':' + String(Math.round((t % 1) * 60)).padStart(2, '0'); $('wl').textContent = $('w').value;
    const out = $('out'); out.innerHTML = '';
    for (const k of SP.KEYS) {
      const P = SP.PIECES[k], box = document.createElement('div'); box.className = 'piece';
      box.innerHTML = '<div style="color:#e7ece7">' + P.id + ' · ' + P.name + '</div><div class="note">' + P.notes + '</div>';
      const row = document.createElement('div'); row.className = 'row';
      for (let d = 0; d < 8; d++) {
        const o = { sky, decay: dec, outline: $('o').checked, lit: CoastalPass.light.lampNeed(sky), windFromDeg: +$('w').value }, r = SP.render(k, d, o);
        const c = document.createElement('canvas'); c.width = r.w; c.height = r.h; c.style.width = r.w * Z + 'px'; c.style.height = r.h * Z + 'px';
        c.getContext('2d').putImageData(new ImageData(r.rgba, r.w, r.h), 0, 0);
        const cell = document.createElement('div'); cell.className = 'cell'; cell.appendChild(c);
        const lab = document.createElement('div'); lab.textContent = 'dir ' + d + ' · faces ' + SP.facings()[d].showFaces; cell.appendChild(lab); row.appendChild(cell);
      }
      box.appendChild(row); out.appendChild(box);
    }
  }
  for (const id of ['t', 'c', 'd', 'z', 'o', 'w']) $(id).addEventListener('input', draw);
  draw();
</script>
</body>
</html>
