<!doctype html>
<html><head><meta charset="utf-8"><title>Shipyard ISO rig — bake harness</title>
<style>
  body { margin:0; background:#0a1014; color:#cfd8d6; font:12px ui-monospace,Menlo,monospace; padding:18px 22px 40px; }
  h1 { font:15px ui-monospace,monospace; letter-spacing:0.12em; color:#eef3f2; margin:0 0 4px; }
  p  { color:#5f7c82; margin:0 0 16px; max-width:820px; line-height:1.6; }
  canvas { image-rendering:pixelated; display:block; border:1px solid #1e2f36; background:#0f1b21; max-width:100%; }
  label { color:#8fa8ad; margin-right:14px; }
  select, input { background:#101c22; color:#cfd8d6; border:1px solid #24383f; padding:3px 5px; font:inherit; }
  input[type=number] { width:60px; }
  button { background:#7fd0c0; color:#0b1216; border:0; padding:6px 14px; font:inherit; letter-spacing:0.08em; cursor:pointer; margin-right:6px; }
  button.alt { background:#24383f; color:#cfd8d6; }
  #stat { color:#5f7c82; }
  .row { display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-bottom:10px; }
</style>
<script src="hulls/doryIsoRig.js"></script>
<script src="hulls/puntIsoRig.js"></script>
<script src="hulls/consoleIsoRig.js"></script>
<script src="hulls/lobsterBoatIsoRig.js"></script>
<script src="hulls/capeIslanderIsoRig.js"></script>
<script src="hulls/sideDraggerIsoRig.js"></script>
<script src="hulls/sternTrawlerMk2IsoRig.js"></script>
<script src="hulls/coastalPacketIsoRig.js"></script>
<script src="hulls/tankerIsoRig.js"></script>
<script src="shipyardIsoRig.js"></script></head>
<body>
<h1>SHIPYARD ISO RIG &mdash; BAKE HARNESS</h1>
<p>Five yards and twenty parts, baked on demand. A whole site is a planning bake: the rig drops px/m
until the sheet fits and reports what it used. Zero water pixels are baked, even in the wet basin.
HULLS composites the fleet's own bakes onto the published mounts.</p>

<div class="row">
  <label>site <select id="site"></select></label>
  <label>hull <select id="hull"><option value="">(site default)</option></select></label>
  <label>dir <input type="number" id="dir" value="5" min="0" max="7"></label>
  <label>elev <input type="number" id="elev" value="40" min="15" max="70"></label>
  <label>tide <input type="number" id="tide" value="1.0" step="0.1"></label>
  <label>range <input type="number" id="range" value="1.8" step="0.1"></label>
  <label>px/m <input type="number" id="ppm" placeholder="auto"></label>
  <label><input type="checkbox" id="hulls" checked> hulls</label>
  <label><input type="checkbox" id="fence" checked> fence</label>
  <label><input type="checkbox" id="gate" checked> gate shut</label>
</div>
<div class="row">
  <button id="go">BAKE SITE</button>
  <button id="turn" class="alt">TURNTABLE &times;8</button>
  <button id="parts" class="alt">PARTS SHEET</button>
  <button id="tides" class="alt">TIDE SWEEP</button>
  <button id="save" class="alt">SAVE PNG</button>
  <span id="stat"></span>
</div>
<canvas id="sheet" width="1200" height="700"></canvas>

<script>
const cv = document.getElementById('sheet'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const stat = m => $('stat').textContent = m;

for(const id of ShipyardIso.sites()){
  const o = document.createElement('option');
  o.value = id; o.textContent = ShipyardIso.SITES[id].label; $('site').appendChild(o);
}
$('site').value = 'workingYard';
for(const b of ShipyardIso.SHIPS){
  const o = document.createElement('option');
  o.value = b.id; o.textContent = b.label + '  (' + b.loa + ' m)'; $('hull').appendChild(o);
}

function opts(extra){
  const o = { elev:+$('elev').value || 40, tide:+$('tide').value, tideRange:+$('range').value || 1.8,
    hulls:$('hulls').checked, fence:$('fence').checked, gateClosed:$('gate').checked };
  if($('hull').value) o.hull = $('hull').value;
  if(+$('ppm').value) o.pxPerM = +$('ppm').value;
  return Object.assign(o, extra || {});
}
function put(cell, x, y){
  const t = document.createElement('canvas'); t.width = cell.w; t.height = cell.h;
  t.getContext('2d').putImageData(new ImageData(cell.data, cell.w, cell.h), 0, 0);
  ctx.drawImage(t, x, y);
}
function fit(cells, cols, pad, label){
  const cw = Math.max(...cells.map(c => c.cell.w)), ch = Math.max(...cells.map(c => c.cell.h));
  const rows = Math.ceil(cells.length / cols);
  cv.width = cols * (cw + pad) + pad; cv.height = rows * (ch + pad + 16) + pad;
  ctx.fillStyle = '#0f1b21'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = '10px ui-monospace,monospace';
  cells.forEach((c, i)=>{
    const cx = pad + (i % cols) * (cw + pad), cy = pad + ((i / cols) | 0) * (ch + pad + 16);
    put(c.cell, cx + ((cw - c.cell.w) >> 1), cy + (ch - c.cell.h));
    ctx.fillStyle = '#7f9aa0'; ctx.fillText(c.label, cx + 2, cy + ch + 12);
  });
}

function bakeSite(){
  const t0 = performance.now(), what = $('site').value;
  const cell = ShipyardIso.render(what, (+$('dir').value || 0) & 7, opts());
  cv.width = cell.w; cv.height = cell.h;
  ctx.fillStyle = '#0f1b21'; ctx.fillRect(0, 0, cv.width, cv.height);
  put(cell, 0, 0);
  const g = ShipyardIso.gameplay(what, opts());
  stat(cell.w + '\u00d7' + cell.h + ' at ' + cell.pxPerM + ' px/m  \u00b7  ' + g.footprint.w + '\u00d7' + g.footprint.d + ' m  \u00b7  '
    + cell.mounts.length + ' mounts, ' + cell.hulls + ' hulls  \u00b7  ' + Math.round(performance.now() - t0) + ' ms');
}
function turntable(){
  const t0 = performance.now(), what = $('site').value, cells = [];
  const ppm = +$('ppm').value || Math.max(4, Math.round(ShipyardIso.fitScale(what, opts()) / 2));
  for(let d = 0; d < 8; d++) cells.push({ label:ShipyardIso.order[d], cell:ShipyardIso.render(what, d, opts({ pxPerM:ppm })) });
  fit(cells, 4, 8);
  stat('8 headings at ' + ppm + ' px/m  \u00b7  ' + Math.round(performance.now() - t0) + ' ms');
}
function partsSheet(){
  const t0 = performance.now(), cells = [];
  for(const id of ShipyardIso.list())
    cells.push({ label:id, cell:ShipyardIso.render(id, (+$('dir').value || 0) & 7, opts({ pxPerM:16 })) });
  fit(cells, 5, 8);
  stat(cells.length + ' parts at 16 px/m  \u00b7  ' + Math.round(performance.now() - t0) + ' ms');
}
function tideSweep(){
  const t0 = performance.now(), what = $('site').value, R = +$('range').value || 1.8, cells = [];
  const ppm = +$('ppm').value || Math.max(4, Math.round(ShipyardIso.fitScale(what, opts()) / 2));
  for(let i = 0; i <= 4; i++){
    const t = +(R * i / 4).toFixed(2);
    cells.push({ label:t.toFixed(2) + ' m', cell:ShipyardIso.render(what, (+$('dir').value || 0) & 7, opts({ tide:t, pxPerM:ppm })) });
  }
  fit(cells, 5, 8);
  stat('tide 0 \u2192 ' + R + ' m at ' + ppm + ' px/m  \u00b7  ' + Math.round(performance.now() - t0) + ' ms');
}

$('go').onclick = bakeSite;
$('turn').onclick = turntable;
$('parts').onclick = partsSheet;
$('tides').onclick = tideSweep;
$('save').onclick = ()=>{
  const a = document.createElement('a');
  a.download = $('site').value + '.png'; a.href = cv.toDataURL('image/png'); a.click();
};
bakeSite();
</script>
</body></html>
