<div id="hh-cast-viewer">
  <div class="cast-title"><span>Hidden Harbours · Character finish</span><span class="text-small text-muted">10 characters · 35 animations</span></div>
  <div class="viz-controls">
    <label class="form-label">Animation<select class="form-select" data-clip></select></label>
    <label class="form-label">View<select class="form-select" data-view><option value="cast">Full cast</option><option value="inspect">Inspect character</option></select></label>
  </div>
  <div class="viz-row cast-transport">
    <button type="button" class="btn btn-primary" data-play aria-pressed="false">Play</button>
    <button type="button" class="btn" data-spin aria-pressed="false">Rotate 360°</button>
    <label class="form-label">Speed<select class="form-select" data-speed aria-label="Playback speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
    <label class="form-label">Pixels<select class="form-select" data-density aria-label="Pixel density"><option value="32">Gameplay · 32 px/m</option><option value="64" selected>Detail · 64 px/m</option><option value="96">Portrait · 96 px/m</option></select></label>
    <label class="form-label">Art pass<select class="form-select" data-pass aria-label="Character refinement comparison"><option value="before">Original · pass 04</option><option value="previous">Previous eyes · pass 05</option><option value="after" selected>Revised eyes · pass 06</option></select></label>
  </div>
  <div class="viz-controls cast-sliders">
    <label class="form-label">Rotation <span class="tabular-nums" data-angle-value>0°</span><input class="form-range" data-angle type="range" min="0" max="360" value="0" step="1" aria-label="Rotation in degrees"></label>
    <label class="form-label">Frame <span class="tabular-nums" data-frame-value>1 / 8</span><input class="form-range" data-frame type="range" min="0" max="1000" value="0" step="1" aria-label="Animation timeline"></label>
  </div>
  <div data-gallery class="cast-gallery" aria-label="Full cast"></div>
  <div data-inspector hidden>
    <label class="form-label">Character<select class="form-select" data-character></select></label>
    <label class="form-label" data-wardrobe-controls hidden>Clothing study<select class="form-select" data-wardrobe><option value="original">Original clothing</option></select></label>
    <p class="text-small text-muted" data-wardrobe-fit hidden></p>
    <div class="cast-inspect-grid">
      <div><canvas data-body role="img" aria-label="Selected character, full body"></canvas><div class="text-small text-muted">Full body · drag to rotate</div></div>
      <div><canvas data-head role="img" aria-label="Selected character, animated head"></canvas><div class="text-small text-muted">Head · follows the body animation</div></div>
    </div>
    <div class="viz-controls">
      <label class="form-label">Expression<select class="form-select" data-expression><option value="auto">Follow animation</option><option value="neutral">Neutral</option><option value="smile">Smile</option><option value="grin">Grin</option><option value="frown">Frown</option><option value="worry">Worry</option><option value="oh">Surprise</option><option value="grit">Effort</option><option value="weary">Weary</option></select></label>
      <label class="form-check"><input class="form-check-input" type="checkbox" data-talk><span class="form-check-label">Speaking</span></label>
    </div>
  </div>
  <div class="text-small text-muted cast-status" data-status role="status" aria-live="polite">Paused · select a character to inspect</div>
</div>
<style>
#hh-cast-viewer{width:100%;color:var(--foreground)}
#hh-cast-viewer .cast-title{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
#hh-cast-viewer .cast-transport{margin:12px 0}
#hh-cast-viewer .cast-sliders{margin:16px 0}
#hh-cast-viewer .cast-gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
#hh-cast-viewer .cast-person{min-width:0;display:flex;flex-direction:column;align-items:stretch;text-align:center;gap:4px}
#hh-cast-viewer canvas{width:100%;display:block;image-rendering:pixelated;touch-action:pan-y;cursor:ew-resize}
#hh-cast-viewer .cast-person canvas{aspect-ratio:3/4;object-fit:contain}
#hh-cast-viewer .cast-inspect-grid{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:20px;margin:8px 0 18px}
#hh-cast-viewer .cast-inspect-grid>div{min-width:0;text-align:center}
#hh-cast-viewer .cast-inspect-grid canvas{aspect-ratio:1;object-fit:contain}
#hh-cast-viewer .cast-status{margin-top:14px}
#hh-cast-viewer [hidden]{display:none!important}
@media(max-width:600px){#hh-cast-viewer .cast-gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:380px){#hh-cast-viewer .cast-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}#hh-cast-viewer .cast-inspect-grid{gap:8px}}
</style>
